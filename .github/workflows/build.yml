name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 原稿のファイル名が日本語のため、ファイル名の文字コードを UTF-8 にそろえる
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Check test spec is up to date
        run: python3 scripts/update_test_spec.py --check

      - name: Check error and function IDs across design docs
        run: python3 scripts/check_docs_trace.py

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: FishingNote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
